!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>nevaOS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <!-- Top bar -->
  <div id="top">
    <p id="welcomeopen" class="pill bold">NevaOS</p>
    <p class="pill">☀️ Always Learning ☁️</p>
    <p id="timeElement" class="pill"></p>
  </div>
 
  <!-- Desktop icons -->
  <div id="desktopApps">
    <div class="icon" id="notesIcon" data-open="notes">
      <img src="artistic-3d-modern-sphere-art.jpg" />
      <p>Notes</p>
    </div>
    <div class="icon" id="calcIcon" data-open="calc">
      <img src="calculator-illustration-design-free-png.webp" />
      <p>Calculator</p>
    </div>
    <div class="icon" id="shoppingIcon" data-open="shopping">
      <img src="shoppinglist.png" />
      <p>Shopping List</p>
    </div>
  </div>
 
  <!-- Welcome window -->
  <div class="window" id="welcome" style="top: calc(50% - 90px); left: calc(50% - 190px)">
    <div class="windowheader">
      <div class="closebutton"></div>
      <p class="headertext">Welcome</p>
      <div class="spacer"></div>
    </div>
    <div class="body welcome-body">
      <img src="blue sky.avif" />
      <h1>nevaOS</h1>
      <p>Welcome to NevaOS</p>
    </div>
  </div>
 
  <!-- Notes -->
  <div class="window hidden" id="notes" style="top: calc(50% - 240px); left: calc(50% - 280px)">
    <div class="windowheader">
      <div class="closebutton"></div>
      <p class="headertext">Notes</p>
      <div class="spacer"></div>
    </div>
    <div class="body notes-body">
      <div class="notes-side">
        <button id="newNote">+ New note</button>
        <ul id="noteList"></ul>
      </div>
      <textarea id="noteText" placeholder="Select or create a note..."></textarea>
    </div>
  </div>
 
  <!-- Calculator -->
  <div class="window hidden" id="calc" style="top: calc(50% - 200px); left: calc(50% - 150px)">
    <div class="windowheader">
      <div class="closebutton"></div>
      <p class="headertext">Calculator</p>
      <div class="spacer"></div>
    </div>
    <div class="body calc-body">
      <input type="text" id="display" readonly />
      <div class="keys" id="keys"></div>
    </div>
  </div>
 
  <!-- Shopping list -->
  <div class="window hidden" id="shopping" style="top: calc(50% - 170px); left: calc(50% - 160px)">
    <div class="windowheader">
      <div class="closebutton"></div>
      <p class="headertext">Shopping List</p>
      <div class="spacer"></div>
    </div>
    <div class="body shopping-body">
      <div class="row">
        <input type="text" id="shoppinginput" placeholder="Add an item..." />
        <button id="shoppingadd">Add</button>
      </div>
      <ul id="shoppinglist"></ul>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
